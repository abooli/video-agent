<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Multi-Cam Review — __SESSION_NAME__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Inter', -apple-system, sans-serif; background: #faf9f7; color: #2c2c2c; height: 100vh; display: flex; overflow: hidden; }

/* Sidebar (left) */
.sidebar { width: 380px; flex-shrink: 0; padding: 16px; display: flex; flex-direction: column; gap: 12px; border-right: 1px solid #e0ddd8; background: #f0eeea; overflow-y: auto; }
.sidebar h1 { font-family: 'Newsreader', Georgia, serif; font-size: 22px; font-weight: 600; color: #1a1a1a; }

/* Video stack in sidebar */
.video-stack { display: flex; flex-direction: column; gap: 8px; }
.video-cell { position: relative; border-radius: 6px; overflow: hidden; background: #000; }
.video-cell video { width: 100%; display: block; border-radius: 6px; }
.video-label { position: absolute; top: 6px; left: 6px; background: rgba(0,0,0,0.7); color: #fff; padding: 3px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.video-label.primary { background: rgba(76, 175, 80, 0.85); }

/* Controls */
.controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
button { padding: 8px 14px; background: #3d8c40; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 13px; font-family: 'Newsreader', Georgia, serif; font-weight: 600; }
button:hover { background: #357a38; }
button.danger { background: #d32f2f; }
button.danger:hover { background: #b71c1c; }
button.purple { background: #7c3aed; }
button.purple:hover { background: #6d28d9; }
button.blue { background: #2196F3; }
button.blue:hover { background: #1976D2; }
select { padding: 7px 10px; background: #fff; color: #2c2c2c; border: 1px solid #d0cdc8; border-radius: 6px; font-size: 13px; }
.time-display { font-family: 'SF Mono', 'Consolas', monospace; font-size: 13px; color: #888; }

/* Stats */
.stats { padding: 12px 16px; background: #fff; border-radius: 6px; font-size: 14px; display: flex; gap: 20px; flex-wrap: wrap; border: 1px solid #e0ddd8; }
.stats-item { display: flex; flex-direction: column; gap: 2px; }
.stats-label { font-size: 11px; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
.stats-value { font-size: 16px; font-weight: 600; font-family: monospace; }
.stats-value.after { color: #4CAF50; }
.stats-value.removed { color: #ff9800; }

/* Help */
.help { font-size: 12px; color: #888; background: #fff; padding: 10px; border-radius: 6px; line-height: 1.8; border: 1px solid #e0ddd8; }
.help b { color: #2c2c2c; }

/* Sidebar buttons */
.sidebar-buttons { display: flex; flex-direction: column; gap: 6px; margin-top: auto; }
.sidebar-buttons button { width: 100%; padding: 10px; font-size: 14px; }

/* Main (right) — word panel */
.main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.right-panel { flex: 1; overflow-y: auto; padding: 20px 24px; }
.content { line-height: 2.5; }
.word { display: inline-block; padding: 4px 2px; margin: 2px; border-radius: 4px; cursor: pointer; transition: all 0.15s; }
.word:hover { background: #e8e5e0; }
.word.current { background: #4a9eff; color: white; }
.word.selected { background: #d32f2f; color: white; text-decoration: line-through; }
.word.ai-selected { background: #f59e0b; color: white; }
.word.ai-selected.selected { background: #d32f2f; }
.gap { display: inline-block; background: #e8e5e0; color: #999; padding: 4px 8px; margin: 2px; border-radius: 4px; font-size: 12px; cursor: pointer; }
.gap:hover { background: #ddd9d3; }
.gap.selected { background: #d32f2f; color: white; }
.gap.ai-selected { background: #f59e0b; color: white; }
.gap.ai-selected.selected { background: #d32f2f; }

/* Loading overlay */
.loading-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.92); z-index: 9999; justify-content: center; align-items: center; flex-direction: column; }
.loading-overlay.show { display: flex; }
.loading-spinner { width: 60px; height: 60px; border: 4px solid #e0ddd8; border-top-color: #7c3aed; border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-text { margin-top: 20px; font-size: 18px; color: #2c2c2c; font-family: 'Newsreader', serif; }
</style>
</head><body>

<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loadingText">Cutting all angles...</div>
</div>

<div class="sidebar">
  <h1>__SESSION_NAME__</h1>
  <div class="video-stack" id="videoStack">
    <!-- Video cells injected by JS -->
  </div>
  <div class="controls">
    <button id="playBtn">Play</button>
    <select id="speed">
      <option value="0.5">0.5x</option><option value="0.75">0.75x</option>
      <option value="1" selected>1x</option><option value="1.25">1.25x</option>
      <option value="1.5">1.5x</option><option value="2">2x</option>
    </select>
    <span class="time-display" id="timeDisplay">0:00 / 0:00</span>
  </div>
  <div class="stats" id="statsPanel">
    <div class="stats-item"><span class="stats-label">Original</span><span class="stats-value" id="statOriginal">--</span></div>
    <div class="stats-item"><span class="stats-label">After</span><span class="stats-value after" id="statAfter">--</span></div>
    <div class="stats-item"><span class="stats-label">Removed</span><span class="stats-value removed" id="statRemoved">--</span></div>
  </div>
  <div class="help">
    <div><b>Click</b> = jump | <b>Dbl-click</b> = toggle | <b>Shift+drag</b> = batch</div>
    <div><b>Space</b> = play/pause | <b>Arrow</b> = 1s | <b>Shift+Arrow</b> = 5s</div>
    <div><span style="color:#f59e0b">Orange</span> = auto-detected | <span style="color:#d32f2f">Red</span> = marked for deletion</div>
  </div>
  <div class="sidebar-buttons">
    <button class="blue" id="saveBtn">Save Progress</button>
    <button class="purple" id="cutBtn">Cut All Angles</button>
    <button class="danger" id="clearBtn">Clear All</button>
  </div>
</div>

<div class="main">
  <div class="right-panel" id="wordPanel">
    <div class="content" id="content"></div>
  </div>
</div>

<script>
// === DATA (injected by generate_review.js) ===
/*__MULTICAM_DATA__*/

// === STATE ===
var state = {
  words: WORDS,
  selected: new Set(AUTO_SELECTED),
  skipIntervals: [],
  skipLock: false,
  playing: false,
  dragging: false,
  dragMode: null,
  audioCtx: null,
  gainNode: null,
  lastSync: {},
};

// === INIT ===
(function init() {
  buildVideoStack();
  renderWords();
  updateStats();
  setupPlayback();
  setupKeyboard();
  loadSavedSelections();
})();

function buildVideoStack() {
  var stack = document.getElementById('videoStack');
  stack.innerHTML = '';

  SYNC_DATA.angles.forEach(function(angle, i) {
    var cell = document.createElement('div');
    cell.className = 'video-cell';

    var video = document.createElement('video');
    video.id = 'video-' + i;
    video.preload = 'auto';
    video.src = '/video/' + encodeURIComponent(angle.file);
    video.muted = (i !== 0);
    video.playsInline = true;

    var label = document.createElement('div');
    label.className = 'video-label' + (i === 0 ? ' primary' : '');
    label.textContent = (i === 0 ? 'Primary: ' : 'Angle ' + (i + 1) + ': ') + angle.file;

    cell.appendChild(video);
    cell.appendChild(label);
    stack.appendChild(cell);
  });
}

function getPrimaryVideo() { return document.getElementById('video-0'); }

function getAllVideos() {
  return SYNC_DATA.angles.map(function(_, i) { return document.getElementById('video-' + i); });
}

// === AUDIO (Web Audio API for instant skip-muting) ===
function initAudio() {
  if (state.audioCtx) return;
  var primary = getPrimaryVideo();
  state.audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  var source = state.audioCtx.createMediaElementSource(primary);
  state.gainNode = state.audioCtx.createGain();
  source.connect(state.gainNode);
  state.gainNode.connect(state.audioCtx.destination);
}

// === SYNCED PLAYBACK ===
function setupPlayback() {
  document.getElementById('playBtn').addEventListener('click', togglePlay);
  document.getElementById('speed').addEventListener('change', function() {
    var rate = parseFloat(this.value);
    getAllVideos().forEach(function(v) { v.playbackRate = rate; });
  });
  requestAnimationFrame(tick);
}

function togglePlay() {
  if (state.playing) { pauseAll(); } else { playAll(); }
}

function playAll() {
  // Init audio on first user gesture (must happen in click handler)
  initAudio();
  if (state.audioCtx.state === 'suspended') state.audioCtx.resume();

  state.playing = true;
  document.getElementById('playBtn').textContent = 'Pause';

  // Just play — don't seek. Videos should already be at correct positions.
  getAllVideos().forEach(function(v) {
    v.play().catch(function() {});
  });
}

function pauseAll() {
  state.playing = false;
  document.getElementById('playBtn').textContent = 'Play';
  getAllVideos().forEach(function(v) { v.pause(); });
}

function seekAll(time) {
  // Always pause first, then seek — never seek while playing
  var wasPlaying = state.playing;
  if (wasPlaying) pauseAll();

  var primary = getPrimaryVideo();
  primary.currentTime = time;
  var videos = getAllVideos();
  for (var i = 1; i < videos.length; i++) {
    var offset = SYNC_DATA.angles[i].offsetSec - SYNC_DATA.angles[0].offsetSec;
    videos[i].currentTime = time + offset;
  }

  // Resume after seek settles
  if (wasPlaying) {
    setTimeout(function() { playAll(); }, 200);
  }
}

function tick() {
  requestAnimationFrame(tick);
  var primary = getPrimaryVideo();
  if (!primary || primary.paused) return;

  var t = primary.currentTime;
  var clapOffset = SYNC_DATA.angles[0].clapTimeSec;
  var relativeTime = t - clapOffset;

  // Skip selected intervals
  for (var si = 0; si < state.skipIntervals.length; si++) {
    var iv = state.skipIntervals[si];
    if (relativeTime >= iv.start && relativeTime < iv.end) {
      if (!state.skipLock) {
        state.skipLock = true;
        if (state.gainNode) state.gainNode.gain.setValueAtTime(0, state.audioCtx.currentTime);
        seekAll(iv.end + clapOffset);
      }
      return;
    }
  }
  if (state.skipLock) {
    state.skipLock = false;
    if (state.gainNode) state.gainNode.gain.setValueAtTime(1, state.audioCtx.currentTime);
  }

  // No drift correction during playback — sync is set on play/seek only

  updateTimeDisplay(relativeTime);
  highlightCurrent(relativeTime);
}

function updateTimeDisplay(t) {
  var primary = getPrimaryVideo();
  var clapOffset = SYNC_DATA.angles[0].clapTimeSec;
  var duration = primary.duration ? primary.duration - clapOffset : 0;
  document.getElementById('timeDisplay').textContent = formatTime(Math.max(0, t)) + ' / ' + formatTime(Math.max(0, duration));
}

function formatTime(s) {
  if (!isFinite(s)) return '0:00';
  var m = Math.floor(s / 60);
  var sec = Math.floor(s % 60);
  return m + ':' + (sec < 10 ? '0' : '') + sec;
}

// === WORD RENDERING ===
function renderWords() {
  var container = document.getElementById('content');
  container.innerHTML = '';

  state.words.forEach(function(w, i) {
    var el = document.createElement('span');
    el.dataset.idx = i;

    if (w.isGap) {
      el.className = 'gap';
      var dur = (w.end - w.start).toFixed(1);
      el.textContent = '⏸ ' + dur + 's';
    } else {
      el.className = 'word';
      el.textContent = w.text;
    }

    if (state.selected.has(i)) {
      el.classList.add('selected');
    } else if (AUTO_SELECTED.indexOf(i) !== -1) {
      el.classList.add('ai-selected');
    }

    el.addEventListener('click', function(e) {
      if (state.dragging) return;
      var clapOffset = SYNC_DATA.angles[0].clapTimeSec;
      seekAll(w.start + clapOffset);
      updateTimeDisplay(w.start);
    });

    el.addEventListener('dblclick', function(e) {
      e.preventDefault();
      toggleWord(i);
    });

    el.addEventListener('mousedown', function(e) {
      if (e.shiftKey) {
        e.preventDefault();
        state.dragging = true;
        state.dragMode = state.selected.has(i) ? 'deselect' : 'select';
        applyDrag(i);
      }
    });

    el.addEventListener('mouseenter', function(e) {
      if (state.dragging) applyDrag(i);
    });

    container.appendChild(el);
  });

  document.addEventListener('mouseup', function() {
    if (state.dragging) {
      state.dragging = false;
      state.dragMode = null;
      rebuildSkipIntervals();
      updateStats();
    }
  });

  rebuildSkipIntervals();
}

function toggleWord(idx) {
  if (state.selected.has(idx)) { state.selected.delete(idx); }
  else { state.selected.add(idx); }
  updateWordEl(idx);
  rebuildSkipIntervals();
  updateStats();
}

function applyDrag(idx) {
  if (state.dragMode === 'select') { state.selected.add(idx); }
  else { state.selected.delete(idx); }
  updateWordEl(idx);
}

function updateWordEl(idx) {
  var el = document.querySelector('[data-idx="' + idx + '"]');
  if (!el) return;
  el.classList.remove('selected', 'ai-selected');
  if (state.selected.has(idx)) { el.classList.add('selected'); }
  else if (AUTO_SELECTED.indexOf(idx) !== -1) { el.classList.add('ai-selected'); }
}

function highlightCurrent(t) {
  var prev = document.querySelector('.word.current, .gap.current');
  if (prev) prev.classList.remove('current');

  for (var i = 0; i < state.words.length; i++) {
    var w = state.words[i];
    if (t >= w.start && t < w.end) {
      var el = document.querySelector('[data-idx="' + i + '"]');
      if (el && !state.selected.has(i)) {
        el.classList.add('current');
        el.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
      break;
    }
  }
}

// === SKIP INTERVALS ===
function rebuildSkipIntervals() {
  state.skipIntervals = [];
  var inSkip = false;
  var skipStart = 0;

  for (var i = 0; i < state.words.length; i++) {
    if (state.selected.has(i)) {
      if (!inSkip) { skipStart = state.words[i].start; inSkip = true; }
    } else {
      if (inSkip) {
        state.skipIntervals.push({ start: skipStart, end: state.words[i].start });
        inSkip = false;
      }
    }
  }
  if (inSkip && state.words.length > 0) {
    state.skipIntervals.push({ start: skipStart, end: state.words[state.words.length - 1].end });
  }
}

// === STATS ===
function updateStats() {
  var total = 0, removed = 0;
  state.words.forEach(function(w, i) {
    var dur = w.end - w.start;
    total += dur;
    if (state.selected.has(i)) removed += dur;
  });
  document.getElementById('statOriginal').textContent = formatTime(total);
  document.getElementById('statAfter').textContent = formatTime(total - removed);
  document.getElementById('statRemoved').textContent = formatTime(removed);
}

// === KEYBOARD ===
function setupKeyboard() {
  document.addEventListener('keydown', function(e) {
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
    var primary = getPrimaryVideo();
    var clapOffset = SYNC_DATA.angles[0].clapTimeSec;

    switch (e.code) {
      case 'Space':
        e.preventDefault();
        togglePlay();
        break;
      case 'ArrowRight':
        e.preventDefault();
        seekAll(primary.currentTime + (e.shiftKey ? 5 : 1));
        break;
      case 'ArrowLeft':
        e.preventDefault();
        seekAll(Math.max(clapOffset, primary.currentTime - (e.shiftKey ? 5 : 1)));
        break;
    }
  });
}

// === SAVE / LOAD ===
document.getElementById('saveBtn').addEventListener('click', function() {
  fetch('/save', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ selected: Array.from(state.selected) }),
  }).then(function(r) { return r.json(); })
    .then(function() { document.getElementById('saveBtn').textContent = 'Saved!'; setTimeout(function() { document.getElementById('saveBtn').textContent = 'Save Progress'; }, 2000); });
});

function loadSavedSelections() {
  fetch('/data/saved_selections.json')
    .then(function(r) { if (r.ok) return r.json(); throw new Error('none'); })
    .then(function(data) {
      if (data && data.selected) {
        state.selected = new Set(data.selected);
        renderWords();
        updateStats();
      }
    })
    .catch(function() {});
}

// === CUT ===
document.getElementById('cutBtn').addEventListener('click', function() {
  if (!confirm('Cut all angles with current selections?')) return;
  var overlay = document.getElementById('loadingOverlay');
  overlay.classList.add('show');

  fetch('/cut', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ selected: Array.from(state.selected) }),
  })
  .then(function(r) { return r.json(); })
  .then(function(result) {
    overlay.classList.remove('show');
    if (result.ok) {
      alert('All angles cut successfully!\n\n' + result.results.map(function(r) { return r.file + ' -> ' + r.output; }).join('\n'));
    } else {
      alert('Some cuts failed:\n\n' + JSON.stringify(result.results, null, 2));
    }
  })
  .catch(function(e) {
    overlay.classList.remove('show');
    alert('Error: ' + e.message);
  });
});

// === CLEAR ===
document.getElementById('clearBtn').addEventListener('click', function() {
  if (!confirm('Clear all selections?')) return;
  state.selected = new Set();
  renderWords();
  updateStats();
});

// === Set initial video position to clap ===
window.addEventListener('load', function() {
  var clapOffset = SYNC_DATA.angles[0].clapTimeSec;
  setTimeout(function() { seekAll(clapOffset); }, 500);
});
</script>
</body></html>
